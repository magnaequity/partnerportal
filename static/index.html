<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magna Equity | Partner Portal</title>
    <link rel="icon" type="image/png" sizes="180x180" href="/static/assets/favicon.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/static/assets/favicon.png?v=3" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <section id="landing" class="landing">
      <div class="landing-glow"></div>
      <header class="landing-header">
        <img src="/static/assets/magna-logo.jpg" alt="Magna Equity" />
        <button id="landingLang" class="ghost-button" type="button">ES</button>
      </header>
      <main class="landing-copy">
        <p class="eyebrow" data-i18n="landingEyebrow">Portal de Tesorería Partner</p>
        <h1 data-i18n="landingTitle">Infraestructura privada para FX, pagos y conciliación.</h1>
        <p data-i18n="landingBody">Flujos seguros de aprobación, trazabilidad por cuenta y ejecución auditable para operaciones institucionales.</p>
        <button id="enterApp" class="primary large" type="button" data-i18n="login">Login</button>
      </main>
    </section>

    <section id="appShell" class="app-shell hidden">
      <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
      <aside id="drawer" class="drawer">
        <div class="drawer-brand">
          <img src="/static/assets/magna-logo.jpg" alt="Magna Equity" />
          <button id="closeDrawer" class="icon-button" type="button" aria-label="Cerrar menu">×</button>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="drawer-controls">
          <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">
            <span class="switch-track"><i></i></span>
            <strong data-theme-toggle-label>Modo oscuro</strong>
          </button>
          <div class="session-card">
            <span data-i18n="currentRole">Rol activo</span>
            <strong id="roleBadge">—</strong>
            <button id="logoutButton" class="ghost-button" type="button" data-i18n="logout">Salir</button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button id="openDrawer" class="menu-button" type="button" aria-label="Abrir menu">☰</button>
          <div>
            <p id="viewEyebrow" class="eyebrow" data-i18n="viewEyebrow">Centro de comando de tesorería</p>
            <h1 id="viewTitle">Dashboard</h1>
          </div>
          <div class="top-actions">
            <div id="topDateFilter" class="top-date-filter"></div>
            <div class="notification-wrap">
              <button id="notificationButton" class="icon-button notification-button" type="button" aria-label="Notificaciones">
                <span>!</span>
                <b id="notificationCount" hidden>0</b>
              </button>
              <div id="notificationMenu" class="notification-menu" hidden></div>
            </div>
            <button id="languageToggle" class="ghost-button" type="button">ES</button>
            <div class="actor-pill">
              <span></span>
              <strong id="actorName">Loading</strong>
            </div>
          </div>
        </header>

        <section id="toast" class="toast" hidden></section>
        <section id="viewBody" class="view-body"></section>
      </main>
    </section>

    <div id="modalRoot"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
